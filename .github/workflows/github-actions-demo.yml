# =============================================================================
# GitHub Actions Demo — вводный workflow для знакомства с Actions
# =============================================================================
# Это учебный пример из документации GitHub. Он НЕ проверяет код проекта.
# Для реального CI используйте workflow: .github/workflows/ci.yml
#
# Запуск:
#   - вручную через вкладку Actions → "GitHub Actions Demo" → "Run workflow"
#   - автоматически при push в main (для демонстрации триггеров)
# =============================================================================

name: GitHub Actions Demo

# Имя конкретного запуска в списке Actions (видно в UI)
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on:
  workflow_dispatch:            # Ручной запуск из UI GitHub
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-actions-demo.yml'  # Только при изменении этого файла

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest

    steps:
      # Каждый step — отдельная команда или action на runner
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"

      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Check out repository code
        uses: actions/checkout@v4   # Стандартный action для клонирования репозитория

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}

      - run: echo "🍏 This job's status is ${{ job.status }}."
